name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-estimate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical test dependency
        run: python -m pip install numpy==2.0.0
      - name: Run local-estimate regression tests
        run: python -m unittest discover -s tests -v
      - name: Check demo and test syntax
        run: python -m compileall -q pyton_code/sobolev_task/main.py tests
